server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Long routes (1000+ km, multi-waypoint) can take BRouter several
        # minutes; keep the proxy from killing the connection mid-compute.
        # The BRouter engine has its own 1800 s maxRunningTime cap.
        proxy_connect_timeout 30s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }

    # Disable cache for app shell + data files in dev so edits land
    # without a hard refresh / browser cache clear.
    location ~* \.(html|js|css|geojson|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
