# Bike routing stack — Graz → Copenhagen.
#
# Phase 1 — ingest (one-shot data pipeline):
#   docker compose run --rm ingest --test     # smoke test (~700 MB)
#   docker compose run --rm ingest            # full corridor (~7 GB)
#
# Phase 2 — routing engine:
#   docker compose up -d brouter              # start BRouter on :17777
#   curl 'http://localhost:17777/brouter?lonlats=15.43,47.07|16.37,48.21&profile=lht&alternativeidx=0&format=geojson'
#
# Phases 3 (api) and 4 (web) are added in their respective commits.

services:
  ingest:
    build: ./ingest
    volumes:
      - ./data:/data
    profiles: ["ingest"]   # only runs when explicitly requested

  brouter:
    build:
      context: ./brouter
    image: bike-brouter:1.7.9
    container_name: bike-brouter
    ports:
      - "17777:17777"
    volumes:
      - ./data/brouter:/opt/brouter/segments4:ro
      - ./brouter/profiles:/opt/brouter/customprofiles:ro
    restart: unless-stopped

  api:
    build: ./api
    container_name: bike-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    environment:
      - BROUTER_URL=http://brouter:17777
      - DATA_DIR=/data
      - DEFAULT_PROFILE=lht
    depends_on:
      - brouter
    restart: unless-stopped

  # === Phase 4: Web UI ===
  # web:
  #   build: ./web
  #   ports: ["8080:80"]
  #   depends_on: [api]
