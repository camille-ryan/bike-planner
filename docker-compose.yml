# Bike routing stack — Graz → Copenhagen.
#
#   docker compose run --rm ingest --test                   # smoke ingest (~700 MB)
#   docker compose run --rm ingest                          # full corridor (~7 GB)
#   docker compose --profile preprocess run --rm pgrouting all \
#       --countries austria,czech-republic,germany,denmark  # SPT preprocess
#   docker compose up -d api web                            # serve

services:
  postgres:
    # PostGIS + pgRouting: persistent, on-disk, spatially-indexed road
    # graph. Memory profile is constant regardless of total graph size
    # because the SPT pass is a streaming SQL Bellman-Ford wave (see
    # pgrouting/compute_spts.py), not pgr_drivingDistance — Postgres
    # only ever holds the per-wave frontier, not the whole graph.
    image: pgrouting/pgrouting:16-3.5-3.7.3
    container_name: bike-postgres
    environment:
      POSTGRES_USER:     bike
      POSTGRES_PASSWORD: bike
      POSTGRES_DB:       bike
    volumes:
      # Named volume on WSL2 ext4 — NOT a bind mount on /mnt/e. Postgres
      # needs proper fsync semantics + low-latency I/O; the Windows
      # filesystem via 9P breaks both. Cost: less inspectable from
      # the host. Worth it.
      - postgres_data:/var/lib/postgresql/data
    # No host port mapping — the `api` and `pgrouting` services reach
    # postgres over the internal Docker network at hostname `postgres`.
    # If you need a psql shell from the host, add a temporary
    # `ports: - "127.0.0.1:5432:5432"` line locally. The dev-default
    # POSTGRES_PASSWORD is weak on purpose, so it must not be exposed.
    shm_size: "1g"
    # Cgroup cap so a runaway query gets killed inside the container
    # rather than taking down the entire WSL VM. Bumped to 10 GB so
    # pgr_dijkstra can fit the 8.8M-edge Graz<->Wien corridor in
    # memory during scenic-profile route exports (the prior 6 GB
    # limit OOM-killed the backend at ~6 GB RSS).
    mem_limit: "4g"
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=128MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=4GB
      -c effective_cache_size=6GB
      -c synchronous_commit=off
    restart: unless-stopped

  ingest:
    build: ./ingest
    volumes:
      - ./data:/data
    profiles: ["ingest"]   # only runs when explicitly requested

  pgrouting:
    # SQL-backed SPT preprocess: stream PBFs into Postgres, snap anchors
    # to graph vertices, run a multi-source Bellman-Ford wave relaxation
    # (one CTE per wave) until convergence, then materialize per-city
    # SPTs as npz under /data/spt/<profile>/. Memory stays bounded by
    # the per-wave frontier regardless of graph size.
    build: ./pgrouting
    depends_on:
      - postgres
    volumes:
      - ./data:/data
    profiles: ["preprocess"]
    environment:
      - PGHOST=postgres
      - PGUSER=bike
      - PGPASSWORD=bike
      - PGDATABASE=bike
      - DATA_DIR=/data
    # No mem_limit needed — Python heap stays small (streaming PBF
    # ingest, batched COPY into Postgres). All the heavy lifting is
    # inside Postgres which has its own bounded shared_buffers config.

  api:
    build: ./api
    container_name: bike-api
    ports:
      - "8001:8000"   # 8000 collides with another local service; map to 8001 on the host
    volumes:
      - ./data:/data:ro
      # Bind-mount the app source so edits to chat.py / main.py land
      # without rebuilding the image. The image still ships a baseline
      # copy for prod / CI; the bind-mount overlays it in dev. Uvicorn
      # is NOT started with --reload, so a `docker compose restart api`
      # is enough to pick up code changes.
      - ./api/app:/app/app
    # api/.env supplies ANTHROPIC_API_KEY for the /chat planner
    # endpoint. Absent-file is tolerated by compose; the /chat endpoint
    # 500s with a clear message if the key isn't set.
    env_file:
      - path: ./api/.env
        required: false
    environment:
      - DATA_DIR=/data
      - DEFAULT_PROFILE=views
      # /live/* endpoints query Postgres directly (anchors list, live
      # cost-gradient view of the multi-source SPT). Postgres is optional
      # — those endpoints just 503 if the DB is unreachable.
      - PGHOST=postgres
      - PGUSER=bike
      - PGPASSWORD=bike
      - PGDATABASE=bike_v2_test
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build: ./web
    container_name: bike-web
    ports:
      - "8080:80"
    # Bind-mount the static tree so edits to index.html / app.js /
    # data/*.geojson land without rebuilding the image. The image is
    # still built (carries the baseline files for prod / CI), the
    # bind-mount overlays it in dev. nginx.conf is bind-mounted for
    # the same reason — SSE / proxy tuning shouldn't require a rebuild.
    volumes:
      - ./web/public:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
