# Bike routing stack — Graz → Copenhagen.
#
# Phase 1 — ingest (one-shot data pipeline):
#   docker compose run --rm ingest --test     # smoke test (~700 MB)
#   docker compose run --rm ingest            # full corridor (~7 GB)
#
# Phase 2 — routing engine:
#   docker compose up -d brouter              # start BRouter on :17777
#   curl 'http://localhost:17777/brouter?lonlats=15.43,47.07|16.37,48.21&profile=lht&alternativeidx=0&format=geojson'
#
# Phases 3 (api) and 4 (web) are added in their respective commits.

services:
  ingest:
    build: ./ingest
    volumes:
      - ./data:/data
    profiles: ["ingest"]   # only runs when explicitly requested

  preprocess:
    # SPT preprocess: PBF -> graph -> multi-source Dijkstra -> Voronoi
    # cells. One-shot, run via `docker compose run --rm preprocess`.
    build: ./preprocess
    volumes:
      - ./data:/data
    profiles: ["preprocess"]
    # SciPy's dijkstra holds the graph + working set in memory.
    shm_size: "2g"
    # Hard cap so an over-large run gets cgroup-OOM-killed cleanly
    # rather than draining the WSL VM and bringing down the docker
    # daemon + every other container with it. Empirically: extract
    # streaming peaks ~1.5 GB / country, disk-spilled merge stays
    # bounded, global Dijkstra peaks ~9 GB on the corridor, per-city
    # phase peaks ~7 GB after we free node arrays + global SPT
    # cost/parent. 11 GB gives ~2 GB headroom and leaves enough RAM
    # in WSL for the kernel + docker + VS Code remote-server. Bump
    # only if your host has more than 16 GB total.
    mem_limit: "11g"

  brouter:
    build:
      context: ./brouter
    image: bike-brouter:1.7.9
    container_name: bike-brouter
    ports:
      - "17777:17777"
    volumes:
      - ./data/brouter:/opt/brouter/segments4:ro
      - ./brouter/profiles:/opt/brouter/customprofiles:ro
    restart: unless-stopped

  api:
    build: ./api
    container_name: bike-api
    ports:
      - "8001:8000"   # 8000 collides with another local service; map to 8001 on the host
    volumes:
      # rw because the API persists a per-leg routing cache under /data/cache.
      # POI and BRouter subdirs are still treated as read-only by the API code.
      - ./data:/data
    environment:
      - BROUTER_URL=http://brouter:17777
      - DATA_DIR=/data
      - DEFAULT_PROFILE=lht
    depends_on:
      - brouter
    restart: unless-stopped

  web:
    build: ./web
    container_name: bike-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
